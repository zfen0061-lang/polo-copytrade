name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-collector.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check frontend/app.js
      - run: node --check frontend/live-ui.js
      - run: node --check frontend/demo-ui.js
      - run: node --check frontend/real-ui.js
      - run: node --test tests/account_refresh.test.mjs
