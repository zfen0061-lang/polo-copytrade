name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test source
        run: python -m unittest discover -s tests
      - name: Build app with browser
        run: python scripts/build_windows.py
      - name: Test packaged app and bundled browser
        run: python scripts/smoke_windows.py
      - name: Archive clean runtime
        run: python scripts/archive_windows.py
      - uses: actions/upload-artifact@v7
        with:
          name: polo-windows
          path: |
            dist/PoloCopyTrade-Windows-x64.zip
            dist/PoloCopyTrade-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download tested package
        run: gh run download "$GITHUB_RUN_ID" --name polo-windows --dir release-assets
      - name: Prepare draft release
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Polo CopyTrade $RELEASE_TAG" \
            --notes "Windows portable preview. Extract the entire folder and run PoloCopyTrade.exe. Packaging checks do not certify online Binance execution. / Windows 便携预览版；完整解压后双击启动。在线交易仍需验证。" \
            release-assets/*.zip release-assets/*.sha256
